name: Daily procurement digest

on:
  schedule:
    - cron: "41 19 * * *"   # 23:41 Yerevan - today's notices
    - cron: "41 3 * * *"    # 07:41 Yerevan - re-check yesterday (fills gaps)
  workflow_dispatch:
    inputs:
      date:
        description: "Date YYYY-MM-DD (empty = today, Yerevan time)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          for i in 1 2 3; do
            sudo apt-get update -q && sudo apt-get install -y -q libarchive-tools catdoc && break
            echo "apt attempt $i failed, retrying"; sleep 20
          done
          for i in 1 2 3; do pip install requests beautifulsoup4 xlrd && break; sleep 15; done

      - name: Pick date
        run: |
          D="${{ github.event.inputs.date }}"
          if [ -z "$D" ]; then
            if [ "${{ github.event.schedule }}" = "41 3 * * *" ]; then
              D=$(TZ=Asia/Yerevan date -d yesterday +%F); echo "BACKFILL=1" >> "$GITHUB_ENV"
            else
              D=$(TZ=Asia/Yerevan date +%F)
            fi
          fi
          echo "DAY=$D" >> "$GITHUB_ENV"
          echo "Processing $D"

      - name: Fetch notices
        continue-on-error: true
        run: |
          python3 scripts/fetch_tenders.py "$DAY" out_g gnanshum 2> log_g.txt &
          python3 scripts/fetch_tenders.py "$DAY" out_b bac      2> log_b.txt &
          python3 scripts/fetch_tenders.py "$DAY" out_a achurd   2> log_a.txt &
          wait
          tail -n 3 log_g.txt log_b.txt log_a.txt

      - name: Classify
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python3 scripts/classify.py "$DAY" out_g/tenders.json out_b/tenders.json out_a/tenders.json

      - name: Build page
        run: |
          python3 scripts/build.py
          TZ=Asia/Yerevan date "+%F %T" > data/last_run.txt

      - name: Commit
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data/ site/index.html
          git diff --cached --quiet && echo "no changes" || (git commit -m "Digest $DAY" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
